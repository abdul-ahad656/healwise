name: Build, Test & Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  IMAGE_NAME: healwise-backend
  ARTIFACT_REPO: healwise-repo
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  # ============================================================
  # TEST JOB - Runs on all PRs and pushes to main/production
  # ============================================================
  test:
    name: Run Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint code with flake8
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pytest
        run: |
          if [ -d "backend/tests" ]; then
            pytest backend/tests -v --cov=backend --cov-report=xml
          else
            echo "⚠️  No tests found in backend/tests, skipping pytest"
            echo "coverage_status=skipped" >> $GITHUB_ENV
          fi

      - name: Upload coverage reports
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # ============================================================
  # BUILD & DEPLOY JOB - Only runs on production branch
  # ============================================================
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build Docker image with layer caching
        run: |
          docker build \
            --cache-from ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --concurrency 80 \
            --max-instances 10 \
            --timeout 300 \
            --set-env-vars FLASK_ENV=production,HF_SPACE_URL=https://adibutt-symptom-classifier.hf.space,HF_API_NAME=/predict,HF_PREDICT_TIMEOUT=90 \
            --set-secrets MONGO_URI=MONGO_URI:latest \
            --set-secrets JWT_SECRET_KEY=JWT_SECRET_KEY:latest \
            --set-secrets SECRET_KEY=SECRET_KEY:latest \
            --set-secrets CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest \
            --set-secrets CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest \
            --set-secrets CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest

      - name: Get Cloud Run service URL
        id: service-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.IMAGE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "✅ Service deployed at: $SERVICE_URL"

      - name: Health check - Verify service is live
        run: |
          SERVICE_URL="${{ steps.service-url.outputs.url }}"
          echo "🔍 Running health check against: $SERVICE_URL/health"
          for i in {1..5}; do
            if curl -f "$SERVICE_URL/health"; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "⏳ Attempt $i/5 failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Deployment Successful!"
          echo "📍 Region: ${{ env.REGION }}"
          echo "🖼️  Image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "🌐 Service URL: ${{ steps.service-url.outputs.url }}"
          echo "🔐 Secrets injected from Google Secret Manager"
          echo "✅ Health check passed"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check Cloud Run logs:"
          echo "gcloud run services logs read ${{ env.IMAGE_NAME }} --region ${{ env.REGION }} --limit 50"
