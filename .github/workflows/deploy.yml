name: Build, Test & Deploy to Cloud Run

on:
  push:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

  pull_request:
    branches:
      - main
      - production
    paths:
      - 'backend/**'
      - 'Dockerfile'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  IMAGE_NAME: healwise-backend
  ARTIFACT_REPO: healwise-repo
  REGISTRY: us-central1-docker.pkg.dev

# -------------------------
# 🧪 TEST JOB
# -------------------------
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint
        run: flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: pytest backend/tests -v --cov=backend


# -------------------------
# 🚀 BUILD & DEPLOY
# -------------------------
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test

    # ONLY deploy from production branch
    if: github.ref == 'refs/heads/production'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 🔐 Authenticate GCP (WIF)
      # -------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      # -------------------------
      # ⚡ Docker Build (CACHED)
      # -------------------------
      - name: Build Docker image
        run: |
          docker build \
            --cache-from ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest \
            .

      # -------------------------
      # 📤 Push Image
      # -------------------------
      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest

      # -------------------------
      # 🚀 Deploy to Cloud Run
      # -------------------------
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 80 \
            --max-instances 20 \
            --timeout 300 \
            --set-env-vars FLASK_ENV=production \
            --set-secrets \
              MONGO_URI=MONGO_URI:latest,\
              JWT_SECRET_KEY=JWT_SECRET_KEY:latest,\
              SECRET_KEY=SECRET_KEY:latest,\
              CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,\
              CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,\
              CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest

      # -------------------------
      # 📡 Get Service URL
      # -------------------------
      - name: Get Cloud Run URL
        id: cloudrun
        run: |
          URL=$(gcloud run services describe ${{ env.IMAGE_NAME }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "SERVICE_URL=$URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed at: $URL"

      # -------------------------
      # 🧪 Health Check
      # -------------------------
      - name: Health Check
        run: |
          curl -f ${{ steps.cloudrun.outputs.SERVICE_URL }}/health || exit 1