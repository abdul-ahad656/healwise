version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healwise-backend
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=main.py
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - ML_MODEL_DIR=/app/app/ml_model/clinicalbert_finetuned
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - healwise-network

networks:
  healwise-network:
    driver: bridge
